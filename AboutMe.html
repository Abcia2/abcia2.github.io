<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact ✦ Abcia2</title>
    <meta name="description" content="Get in touch with Abcia2, by email or on Discord.">
    <link rel="canonical" href="https://abcia-2.web.app/AboutMe.html">
    <meta property="og:title" content="Contact Abcia2">
    <meta property="og:description" content="Get in touch with Abcia2, by email or on Discord.">
    <meta property="og:image" content="https://abcia-2.web.app/assets/Images/Abcia2_PFP.png">
    <meta property="og:image:width" content="2048">
    <meta property="og:image:height" content="2048">
    <meta property="og:url" content="https://abcia-2.web.app/AboutMe.html">
    <meta property="og:site_name" content="Abcia2 Official">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="vars.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="decorations.css">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#7D52A1">
</head>

<body>
    <section class="hero">
        <div class="hero_bg_wrap">
            <div class="hero_bg"></div>
        </div>

        <div class="hero_panel">
            <img class="hero_deco hero_sparkle_1" src="assets/Decorations/Sparkle.png" alt="" aria-hidden="true">
            <img class="hero_deco hero_sparkle_2" src="assets/Decorations/AbiSparkle.png" alt="" aria-hidden="true">
            <img class="hero_deco hero_sparkle_3" src="assets/Decorations/Sparkle.png" alt="" aria-hidden="true">
            <img class="hero_deco hero_sparkle_4" src="assets/Decorations/AbiSparkle.png" alt="" aria-hidden="true">

            <a href="index.html" class="back_link">✦ Back ✦</a>

            <img class="hero_avatar bup" src="assets/Images/Abcia2_PFP.png" alt="Abcia2">

            <h1 class="hero_title">✦ Contact ✦</h1>

            <p class="hero_tagline">
                Got a question, a collab idea, or just want to say hi.<br>
                Pick whatever works best for you.
            </p>

            <div class="hero_socials">
                <a href="https://youtube.com/c/abcia2" target="_blank" rel="noopener" class="hero_social_link bup">
                    <img src="assets/Icons/yt.png" alt="Abcia2 on YouTube" class="hero_social_icon">
                </a>
                <a href="https://www.instagram.com/abcia_2/" target="_blank" rel="noopener"
                    class="hero_social_link bup">
                    <img src="assets/Icons/ig.png" alt="Abcia2 on Instagram" class="hero_social_icon">
                </a>
                <a href="https://www.tiktok.com/@abcia_2" target="_blank" rel="noopener"
                    class="hero_social_link bup">
                    <img src="assets/Icons/tt.png" alt="Abcia2 on TikTok" class="hero_social_icon">
                </a>
                <a href="https://ko-fi.com/abcia2" target="_blank" rel="noopener" class="hero_social_link bup">
                    <img src="assets/Icons/kf.png" alt="Support Abcia2 on Ko-fi" class="hero_social_icon">
                </a>
            </div>
        </div>
    </section>

    <div class="divider">
        <svg class="divider_sparkle" aria-hidden="true">
            <use href="assets/sprite.svg#icon-sparkle"></use>
        </svg>
        <span class="divider_line"></span>
        <svg class="divider_sparkle" aria-hidden="true">
            <use href="assets/sprite.svg#icon-sparkle"></use>
        </svg>
    </div>

    <section class="contact">
        <h2 class="section_title">✦ Get in Touch ✦</h2>

        <div class="contact_grid">
            <a href="mailto:contact@abcia2.com" class="contact_card contact_card_violet">
                <span class="contact_card_icon" aria-hidden="true">📧</span>
                <span class="contact_card_label">Email</span>
                <span class="contact_card_value">contact@abcia2.com</span>
            </a>

            <div class="contact_card contact_card_purple">
                <span class="contact_card_icon" aria-hidden="true">💬</span>
                <span class="contact_card_label">Discord</span>
                <span class="contact_card_value">abcia2</span>
            </div>
        </div>
    </section>

    <footer class="footer">
        <span class="footer_main">✦ Abcia2 Website || contact@abcia2.com ✦</span>
    </footer>

    <script src='https://storage.ko-fi.com/cdn/scripts/overlay-widget.js'></script>
    <script>
        kofiWidgetOverlay.draw('abcia2', {
            'type': 'floating-chat',
            'floating-chat.donateButton.text': 'Support me',
            'floating-chat.donateButton.background-color': '#ffffff',
            'floating-chat.donateButton.text-color': '#323842'
        });
    </script>
</body>

</html>
